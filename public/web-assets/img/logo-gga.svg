<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="380" height="75">
  <defs>
    <linearGradient id="ggaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 7)">
    <polygon points="30,2 58,16 58,44 30,58 2,44 2,16" fill="url(#ggaGrad)" filter="url(#glow)"/>
    <!-- Graduation Cap / Book Symbol inside -->
    <path d="M 30 14 L 46 22 L 30 30 L 14 22 Z" fill="#ffffff" />
    <path d="M 20 27 L 20 37 Q 30 43 40 37 L 40 27 Q 30 32 20 27 Z" fill="#e0e7ff" />
    <path d="M 46 23 L 46 34 L 48 36 L 48 24 Z" fill="url(#goldGrad)" />
    <circle cx="30" cy="46" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="82" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.5">
    GOA <tspan fill="url(#ggaGrad)">GLOBAL</tspan>
  </text>
  <text x="82" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#64748b" letter-spacing="1.8">
    ACADEMY OF HIGHER ED
  </text>
  
  <!-- Decorative Accent Line -->
  <line x1="82" y1="58" x2="280" y2="58" stroke="url(#ggaGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
